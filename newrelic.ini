# ---------------------------------------------------------------------------
# New Relic Agent Configuration File
# ---------------------------------------------------------------------------

# This file configures the New Relic Python Agent.
#
# The agent configuration file uses INI-style format. Settings can be
# overridden via environment variables.
#
# For a list of all available settings and their default values, see:
# https://docs.newrelic.com/docs/agents/python-agent/configuration/python-agent-configuration

# The application name. Set this to be meaningful and unique in your account.
# Can be overridden with NEW_RELIC_APP_NAME environment variable.
[newrelic]
app_name = Fullstack Checkout Service

# New Relic license key. Can be overridden with NEW_RELIC_LICENSE_KEY environment variable.
# IMPORTANT: Set this via environment variable for security
license_key = YOUR_LICENSE_KEY_HERE

# Logging Configuration
# The Python agent will log to the log file specified below.
# By default the log level is info which is good for production.
# Valid log levels are: critical, error, warning, info, debug
[newrelic:log]
# Log file location (use stdout for containerized environments)
log_file = stdout
log_level = info

# Distributed Tracing Configuration
# Enable distributed tracing to track requests across services
[newrelic:distributed_tracing]
enabled = true

# Transaction Tracer Configuration
# Captures detailed info about slow transactions
[newrelic:transaction_tracer]
enabled = true
transaction_threshold = apdex_f
record_sql = obfuscated
stack_trace_threshold = 0.5

# Error Collector Configuration
# Captures application errors and exceptions
[newrelic:error_collector]
enabled = true
ignore_errors =

# Browser Monitoring Configuration
# Enable Real User Monitoring (RUM) if you have a frontend
[newrelic:browser_monitoring]
auto_instrument = true

# Thread Profiler Configuration
[newrelic:thread_profiler]
enabled = true

# Cross Application Tracer Configuration
[newrelic:cross_application_tracer]
enabled = true

# Additional Settings
[newrelic:settings]
# High security mode (optional - adds extra security restrictions)
high_security = false

# Labels (optional - add custom labels to your app in New Relic)
# labels = Environment:Production;Team:Checkout
