# ---------------------------------------------------------------------------

#
# This file configures the New Relic Python Agent.
#
# The path to the configuration file should be supplied to the function
# newrelic.agent.initialize() when the agent is being initialized.
#
# The configuration file follows a structure similar to what you would
# find for Microsoft Windows INI files. For further information on the
# configuration file format see the Python ConfigParser documentation at:
#
#    http://docs.python.org/library/configparser.html
#
# For further discussion on the behaviour of the Python agent that can
# be configured via this configuration file see:
#
#    http://newrelic.com/docs/python/python-agent-configuration
#

# ---------------------------------------------------------------------------

# Here are the settings that are common to all environments.

[newrelic]

# You must specify the license key associated with your New Relic
# account. This can be set via the NEW_RELIC_LICENSE_KEY environment
# variable.
license_key = ${NEW_RELIC_LICENSE_KEY}

# The application name. Set this via the NEW_RELIC_APP_NAME
# environment variable. This name will appear in the New Relic UI.
# If you want to use multiple app names, separate them with semicolons.
app_name = ${NEW_RELIC_APP_NAME:Fullstack Checkout Service}

# When "true", the agent collects performance data about your
# application and reports this data to the New Relic UI at
# newrelic.com. This global switch is normally overridden for each
# environment below.
monitor_mode = true

# Sets the name of a file to log agent messages to. Useful for
# debugging any issues with the agent. This is not set by default
# as it is not known in advance what user your web application
# processes will run as and where they have permission to write to.
# Whatever you set this to you must ensure that the permissions for
# the containing directory and the file itself are correct, and that
# the user that your web application runs as can write to the file.
# If not able to write out a log file, it is also possible to say
# "stderr" and output to standard error output. This would normally
# result in output appearing in your web server log.
# Can be set to "stderr" to log to standard error instead of a file
log_file = stderr

# Sets the level of detail of messages sent to the log file, if a log
# file location has been provided. Possible values, in increasing
# order of detail, are: "critical", "error", "warning", "info" and
# "debug". When reporting any agent issues to New Relic technical
# support, the most useful setting for the support engineers is
# "debug". However, this can generate a lot of information very
# quickly, so it is best not to keep the agent at this level for any
# longer than it takes to reproduce the problem you are experiencing.
log_level = info

# High Security Mode enforces certain security settings and prevents
# them from being overridden. When this setting is active, it prevents
# certain settings from being changed via the New Relic UI.
high_security = false

# The Python Agent will attempt to connect directly to the New Relic
# service. If there is an intermediate firewall between your host and
# the New Relic service that requires you to use a HTTP proxy, then
# you should set the proxy host and port here.
# proxy_scheme = http
# proxy_host = hostname
# proxy_port = 8080
# proxy_user =
# proxy_pass =

# Captures attributes from the transaction. Attributes include the
# request parameters, the agent attributes, and custom attributes.
attributes.enabled = true

# Distributed tracing enables tracing across service boundaries.
# For more information, see: 
# https://docs.newrelic.com/docs/apm/distributed-tracing/getting-started/introduction-distributed-tracing
distributed_tracing.enabled = true

# Setting transaction tracer parameters for performance.
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5

# Error collector captures information about uncaught exceptions and
# sends them to New Relic for viewing.
error_collector.enabled = true

# Browser monitoring provides insight into how customers are interacting
# with the web application in their browsers.
browser_monitoring.auto_instrument = true

# Thread profiler provides detailed information about what your
# application threads are spending time doing. This is a pro feature.
thread_profiler.enabled = true

# ---------------------------------------------------------------------------

#
# Environment specific settings can be provided here. Use the
# [newrelic:environment] notation to override settings for specific
# environments.
#

# Development environment settings
[newrelic:development]
monitor_mode = true
log_level = debug

# Staging environment settings
[newrelic:staging]
monitor_mode = true
app_name = ${NEW_RELIC_APP_NAME:Fullstack Checkout Service (Staging)}

# Production environment settings
[newrelic:production]
monitor_mode = true
log_level = info

# ---------------------------------------------------------------------------
